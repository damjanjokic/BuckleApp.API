services:
  postgres:
    image: postgres:17
    container_name: buckleapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buckleapp
      POSTGRES_USER: buckleapp
      POSTGRES_PASSWORD: buckleapp_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
